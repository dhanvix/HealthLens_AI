<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="View, search, and compare your saved lab reports over time.">
<title>My reports | HealthLens AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<nav><div class="wrap">
  <a class="logo" href="index.html"><img src="logo.jpg" alt="HealthLens AI Logo">Health<span>Lens</span> AI</a>
  <a href="dashboard.html">↑ Upload a report</a>
</div></nav>

<main class="wrap">
  <h1>📋 My reports</h1>
  <p class="sub">Search by test name (like glucose) or by date (like 2026-09).</p>
  <div class="card fade-up" style="margin-bottom:16px;display:grid;gap:12px">
    <label>Person<br><select id="profileSel" style="width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;font:inherit;background:rgba(255,255,255,.7)"></select></label>
    <label>🔍 Search<br><input id="search" type="search" style="width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;font:inherit;background:rgba(255,255,255,.7)"></label>
  </div>
  <div id="histList"></div>
</main>

<footer>HealthLens AI does not give medical advice or diagnosis.</footer>
<script src="js/app.js"></script>
</body>
</html>
